name: Sensitive data guard

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sensitive-data:
    name: Block secrets and company data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked and untracked repository content
        run: bash .github/scripts/check-sensitive-data.sh
